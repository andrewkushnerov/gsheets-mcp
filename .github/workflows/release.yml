name: Release

# Bumping ``__version__`` on the default branch is what publishes a release. This
# workflow reads that literal, takes the notes from CHANGELOG.md and creates the
# release — and with it the tag. Tags are an output here, so do not push them by
# hand: a hand-pushed tag triggers nothing and only blocks the version it names.
on:
  push:
    branches: [main]
    paths: ["gsheets_mcp/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write # creating a release, and the tag under it, writes to the repository

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, because the guard below asks git whether this
          # version has been released already.
          fetch-depth: 0
          fetch-tags: true

      - name: Publish the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # __init__.py imports nothing, so this needs no dependencies installed.
          version=$(python3 -c 'import gsheets_mcp; print(gsheets_mcp.__version__)')

          # __init__.py can change for reasons other than a bump, and the manual
          # trigger can be fired twice. Either way the tag already existing means
          # this version is out.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released — nothing to do"
            exit 0
          fi

          # Everything under '## <version>' up to the next '## ' heading. Compared
          # as a literal string, not a regex, so the dots in 0.3.0 stay dots.
          notes=$(awk -v v="$version" '
            /^## / {
              if (found) exit
              split(substr($0, 4), head, " ")
              gsub(/[\[\]]/, "", head[1])
              if (head[1] == v) found = 1
              next
            }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi

          # --target tags this commit as part of publishing, so the tag never
          # outlives a release that failed to happen.
          gh release create "v$version" \
            --target "$GITHUB_SHA" --title "v$version" --notes "$notes"
